<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    A spring's step response — rise, overshoot, ring, settle — which is the
    curve the app plots and the reason the domain is springs.studio.

    Deliberately a sibling of Ramps rather than a contrast to it: the same
    #131210 plate, the same rx="7" corner, the same 6-unit inset, and blues from
    the same ramp. Only the mark inside differs.

    TWO-TONE, and deliberately underdamped. A single 3.4-wide stroke carried far
    less weight than Ramps' four filled bars, so the two did not read as equals
    side by side; filling the area beneath was tried first and read as a solid
    blob rather than a curve. A heavy #2452b0 stroke with a lighter #8db0ff core
    gives the mark mass while keeping it a LINE, which is what it is about.
    Two tones from one ramp is where Ramps' mass comes from.

    Damping is zeta = 0.13, low enough that the curve overshoots and rings twice
    before settling. The earlier mark eased once and spent half its width on a
    flat tail, which wasted the plate and undersold what a spring does.

    Generated: y(t) = 1 - e^(-zeta*w*t) * (cos(wd*t) + (zeta/sqrt(1-zeta^2)) * sin(wd*t))
    with w = 2*pi*2.2, wd = w*sqrt(1-zeta^2), normalised by its 1.661 peak so the
    overshoot fits the top inset. Same point list as the `motion` figure in the
    shared ToolMark — change one, change both.
  -->
  <rect width="32" height="32" rx="7" fill="#131210" />
  <polyline points="7.00,24.40 7.20,24.28 7.40,23.93 7.60,23.36 7.80,22.60 8.00,21.68 8.20,20.61 8.40,19.43 8.60,18.18 8.80,16.88 9.00,15.56 9.20,14.26 9.40,13.01 9.60,11.83 9.80,10.75 10.00,9.79 10.20,8.96 10.40,8.28 10.60,7.76 10.80,7.41 11.00,7.22 11.20,7.20 11.40,7.34 11.60,7.62 11.80,8.05 12.00,8.59 12.20,9.24 12.40,9.98 12.60,10.78 12.80,11.63 13.00,12.49 13.20,13.36 13.40,14.21 13.60,15.03 13.80,15.79 14.00,16.48 14.20,17.08 14.40,17.60 14.60,18.01 14.80,18.31 15.00,18.50 15.20,18.59 15.40,18.56 15.60,18.43 15.80,18.21 16.00,17.89 16.20,17.51 16.40,17.05 16.60,16.55 16.80,16.01 17.00,15.44 17.20,14.86 17.40,14.29 17.60,13.73 17.80,13.21 18.00,12.72 18.20,12.28 18.40,11.90 18.60,11.59 18.80,11.34 19.00,11.17 19.20,11.07 19.40,11.04 19.60,11.08 19.80,11.19 20.00,11.36 20.20,11.59 20.40,11.86 20.60,12.18 20.80,12.52 21.00,12.89 21.20,13.27 21.40,13.65 21.60,14.02 21.80,14.39 22.00,14.73 22.20,15.04 22.40,15.31 22.60,15.55 22.80,15.74 23.00,15.89 23.20,15.98 23.40,16.03 23.60,16.03 23.80,15.99 24.00,15.90 24.20,15.77 24.40,15.61 24.60,15.42 24.80,15.20 25.00,14.97" fill="none" stroke="#2452b0" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round" />
