<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    A spring's step response — rise, overshoot, settle — which is the curve the
    app plots and the reason the domain is springs.studio.

    Deliberately a sibling of Ramps rather than a contrast to it: the same
    #131210 plate, the same rx="7" corner, the same 6-unit inset, and blues from
    the same ramp. Only the mark inside differs.

    TWO PARALLEL STROKES, which is where the mass comes from. A single stroke
    carried far less weight than Ramps' four filled bars, so the two did not read
    as equals side by side. Filling the area beneath read as a blob rather than a
    curve, and a heavy stroke with a lighter core read as an outline. A parallel
    pair keeps it a LINE while giving it Ramps' kind of density, and it rhymes
    with the four bars there and the five in Beeps.

    THE DAMPING IS SET BY THE GEOMETRY, NOT BY TASTE, and this is the part worth
    knowing before anyone makes it livelier. Two strokes stay parallel at a gap d
    only where the curve's radius of curvature exceeds d. Ring the spring harder
    and the radius at the overshoot peak collapses — at zeta 0.30 over 1.30
    cycles it is about 0.6 units against a 2.3-unit offset — and the inner stroke
    has nowhere to go but through itself, which is a visible cusp. Every way
    around that was tried: translating straight down instead of offsetting keeps
    the shapes identical but loses the gap exactly where the curve is steep, so
    the strokes merge on the rise; scaling the offset by the local slope holds
    the gap but staggers the two apart diagonally; capping the offset at the
    local radius still kinks. A search over damping, cycles and amplitude found
    only 0.75-cycle curves clear the constraint at a Ramps-like gap.

    So: zeta 0.30 over 0.75 cycles. One rise, one gentle overshoot, one settle.
    Both strokes are 2.6 wide with a constant 4.39-unit centre gap — verified
    constant, and verified to have zero backward-travelling points on either
    stroke. Same point lists as the `motion` figure in the shared ToolMark —
    change one, change both.
  -->
