<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    A spring's step response — rise, overshoot, settle — which is the curve the
    app plots and the reason the domain is springs.studio.

    Deliberately a sibling of Ramps rather than a contrast to it: the same
    #131210 plate, the same rx="7" corner, the same 6px inset, and a blue from
    the same ramp (#8db0ff, its second-lightest step). Only the mark inside
    differs — stripes there, a curve here. 8.7:1 on the plate, so it survives a
    16px tab.

    The curve is normalised by its 1.372 peak, not by its settle value, or the
    overshoot — the entire point of the mark — runs off the top edge.
  -->
