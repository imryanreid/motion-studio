<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    A spring's step response: rise, overshoot, settle. The same curve the app
    plots, and the reason the domain is springs.studio.

    A stroke rather than Ramps' solid bars, deliberately. Ramps' mark is four
    horizontal stripes; a four-stripe amber square next to a four-stripe blue
    one is two tabs you have to read to tell apart. Differing in silhouette is
    what makes this recognisable at 16px, not the detail inside it.

    Amplitude is sized off the 1.372 peak, not the settle line, so the
    overshoot stays inside the box.
  -->
