<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    A spring's step response — rise, overshoot, ring, settle — which is the
    curve the app plots and the reason the domain is springs.studio.

    Deliberately a sibling of Ramps rather than a contrast to it: the same
    #131210 plate, the same rx="7" corner, the same 6-unit inset, and blues from
    the same ramp. Only the mark inside differs.

    TWO STACKED STROKES of equal weight, which is where the mass comes from. A
    single stroke carried far less weight than Ramps' four filled bars, so the
    two did not read as equals side by side. Filling the area beneath read as a
    blob rather than a curve, and a heavy stroke with a lighter core read as an
    outline. A pair of parallel strokes keeps it a LINE while giving it Ramps'
    kind of density, and it rhymes with the four bars there and the five in
    Beeps: the family is stacked strokes, in every mark.

    THE LOWER STROKE IS THE UPPER ONE TRANSLATED STRAIGHT DOWN, not offset along
    its normal, and that is load-bearing. A normal offset folds back through
    itself wherever the offset distance exceeds the local radius of curvature —
    at this amplitude the radius at the overshoot peak is around 0.6 units
    against a 2.4-unit offset, so the inner curve reversed direction and left a
    visible cusp. Translating cannot fold, and it makes the two strokes the same
    shape exactly rather than near-twins. The cost is that the gap foreshortens
    slightly on the steep rise, which reads as perspective rather than error.

    Generated: y(t) = 1 - e^(-zeta*w*t) * (cos(wd*t) + (zeta/sqrt(1-zeta^2)) * sin(wd*t))
    with zeta = 0.30, w = 2*pi*1.30, wd = w*sqrt(1-zeta^2), normalised so the two
    strokes together fill the 6-unit inset exactly and the round caps land on it.
    Same point lists as the `motion` figure in the shared ToolMark — change one,
    change both.
  -->
