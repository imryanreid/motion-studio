    <title>Motion Token Generator</title>

      name="description"
      content="Generate motion tokens you can actually preview: cubic-bezier and spring easing, a named duration scale, asymmetric enter/exit pairs, and exports for CSS, Tailwind, Framer Motion and SwiftUI — with the cross-platform differences stated rather than hidden."

    <!--
      No canonical, og:url or sitemap yet: the domain isn't registered. A
      canonical tag is invisible and, pointed at the wrong place, quietly tells
      search engines this page belongs to someone else. Add all of them together
      when the domain is live — see "The three things that are easy to break" in
      CLAUDE.md.
    -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="author" content="Ryan Reid" />
    <meta name="theme-color" content="#fdfdfc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131210" media="(prefers-color-scheme: dark)" />
  </head>
